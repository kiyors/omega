[workspace.package]
authors = [ "kiyors <gaurav23617@gmail.com>" ]
edition = "2024"
license = "MIT"
version = "0.1.0"

[package]
name              = "omega"
description       = "A high-performance terminal session and workspace navigator"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[workspace]
members = [ "crates/session", "crates/search", "crates/config", "crates/tmux", "crates/daemon" ]

[workspace.dependencies]
clap          = { features = [ "derive" ], version = "4.6" }
clap_complete = "4.6"
color-eyre    = "0.6.5"
crossterm     = "0.29.0"
fuzzy-matcher = "0.3"
mlua          = { features = [ "lua54", "vendored", "serde", "send" ], version = "0.12" }
omega-config  = { path = "crates/config", version = "0.1.0" }
omega-daemon  = { path = "crates/daemon", version = "0.1.0" }
omega-search  = { path = "crates/search", version = "0.1.0" }
omega-session = { path = "crates/session", version = "0.1.0" }
omega-tmux    = { path = "crates/tmux", version = "0.1.0" }
ratatui       = "0.30.2"
serde         = { features = [ "derive" ], version = "1.0" }
serde_json    = "1.0"
tempfile      = "3"
walkdir       = "2.5"

[dependencies]
clap.workspace          = true
clap_complete.workspace = true
color-eyre.workspace    = true
crossterm.workspace     = true
omega-config.workspace  = true
omega-daemon.workspace  = true
omega-search.workspace  = true
omega-session.workspace = true
omega-tmux.workspace    = true
ratatui.workspace       = true
serde_json.workspace    = true

[dev-dependencies]
tempfile.workspace = true

# Read the optimization guideline for more details: https://ratatui.rs/recipes/apps/release-your-app/#optimizations
[profile.release]
codegen-units = 1
lto           = true
opt-level     = "s"
strip         = true

[workspace.lints.clippy]
# 1. The Pedantic Baseline
pedantic = { level = "warn", priority = -1 }

# 2. The "No Cheating" Guard
allow_attributes                = "deny"
allow_attributes_without_reason = "deny"

# 3. Panic & Silent Failure Guards
expect_used      = "deny"
indexing_slicing = "deny"
panic            = "deny"
string_slice     = "deny"
todo             = "deny"
unimplemented    = "deny"
unreachable      = "deny"
unwrap_used      = "deny"

# 4. Async & Concurrency Footguns
await_holding_lock        = "deny"
await_holding_refcell_ref = "deny"
let_underscore_future     = "deny"

# 5. Leftover Debugging
dbg_macro    = "deny"
print_stderr = "deny"
print_stdout = "deny"

# 6. Performance Baseline (Catches needless_collect, map_entry, etc.)
perf = { level = "deny", priority = -1 }

# 7. Explicit Allocation & Clone Guards
cloned_instead_of_copied = "deny"
inefficient_to_string    = "deny"
redundant_clone          = "deny"
unnecessary_to_owned     = "deny"

# 8. String & Buffer Re-allocation Guards (Restriction Group)
format_push_string = "deny" # Prevents string += &format!(...), forcing push_str or write!
str_to_string      = "deny" # Forces explicit to_owned() so allocations stand out in reviews
string_add         = "deny" # Disallows s1 + &s2 heap reallocations; forces mutation/preallocation

# 9. Slice & Collection Initialization
slow_vector_initialization = "deny" # Flags vec![0; n] patterns that zero-fill unnecessarily before overwriting
vec_init_then_push         = "deny" # Flags empty Vec creation followed immediately by repeated pushes without capacity
