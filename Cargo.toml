[package]
name = "omega"
version = "0.1.0"
description = "An example generated using the event-driven template"
authors = ["kiyors <gaurav23617@gmail.com>"]
license = "MIT"
edition = "2024"

[dependencies]
crossterm = "0.29.0"
ratatui = "0.30.2"
color-eyre = "0.6.5"
fuzzy-matcher = "0.3" # Fast scoring (or nucleo)
dirs = "7.0"          # For home dir resolution
walkdir = "2.5"       # Scanning git/worktree directories

# Read the optimization guideline for more details: https://ratatui.rs/recipes/apps/release-your-app/#optimizations
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
